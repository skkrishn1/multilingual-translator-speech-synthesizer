[server]
# Matches MAX_FILE_MB in src/config.py — keep the two in sync.
maxUploadSize = 10

[theme]
base = "dark"
# Lightened from the original indigo so it keeps contrast against a dark background.
primaryColor = "#7C9CFF"
backgroundColor = "#0F1218"
secondaryBackgroundColor = "#191E29"
textColor = "#E6E9EF"

[browser]
gatherUsageStats = false
